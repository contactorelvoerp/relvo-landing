name: CI

on:
  pull_request:
  push:
    branches: [main, web-3.0]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el sitemap usa la fecha del último commit de cada página
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:schema
      - run: npm run lint
      - run: npm run knip
      - run: npm run build
        env:
          VERCEL_ENV: production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run check:links
      - run: npm run check:jsonld
      - name: Rutas y archivos técnicos sin headers especiales (como curl)
        run: |
          npx vite preview --port 4317 --strictPort &
          sleep 5
          npm run check:routes
      - run: npm run check:bands
      - run: npm run check:design
