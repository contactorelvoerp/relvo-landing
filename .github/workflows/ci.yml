name: CI

on:
  pull_request:
  push:
    branches: [main, web-3.0]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el sitemap usa la fecha del último commit de cada página
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:schema
      # Formulario, reserva de Cal.com, etapa del CRM y feed de Google Ads contra Postgres + PostgREST en Docker
      - run: npm run test:flows
      - run: npm run lint
      - run: npm run knip
      - run: npm run build
        env:
          VERCEL_ENV: production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run check:links
      - run: npm run check:jsonld
      - name: Rutas y archivos técnicos sin headers especiales (como curl)
        run: |
          npx vite preview --port 4317 --strictPort &
          sleep 5
          npm run check:routes
      - run: npm run check:bands
      - run: npm run check:design
      # Lighthouse mobile (lighthouserc.json): SEO 100, accesibilidad ≥ 95 y CLS < 0,1 bloquean;
      # rendimiento ≥ 90 y LCP < 2,5 s avisan hasta resolver el LCP de la home
      # (docs/medicion-y-aprendizaje.md §Rendimiento).
      - run: npm run check:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/reports
