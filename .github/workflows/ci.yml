name: CI

on:
  pull_request:
  push:
    branches: [main, web-3.0]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el sitemap usa la fecha del último commit de cada página
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:jsonld
      - run: npm run check:bands
      - run: npm run check:design
